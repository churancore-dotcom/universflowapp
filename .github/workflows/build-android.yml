name: Build Android APK

on:
  workflow_call:
  workflow_dispatch:  # Manual trigger from GitHub
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: |
          # Hard-guarantee the Supabase env vars are present at build time.
          # If the GH secret is empty/unset, fall back to the committed .env
          # values (anon key is public — safe to bake into the APK). Without
          # this, the workflow `env:` block injects empty strings which silently
          # override .env and the Supabase client crashes on init → black APK.
          export VITE_SUPABASE_URL="${VITE_SUPABASE_URL:-$(grep '^VITE_SUPABASE_URL=' .env | cut -d= -f2- | tr -d '"')}"
          export VITE_SUPABASE_PUBLISHABLE_KEY="${VITE_SUPABASE_PUBLISHABLE_KEY:-$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2- | tr -d '"')}"
          export VITE_SUPABASE_PROJECT_ID="${VITE_SUPABASE_PROJECT_ID:-$(grep '^VITE_SUPABASE_PROJECT_ID=' .env | cut -d= -f2- | tr -d '"')}"
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Supabase env missing — APK would black-screen. Aborting build."
            exit 1
          fi
          echo "VITE_SUPABASE_URL length=${#VITE_SUPABASE_URL}"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY length=${#VITE_SUPABASE_PUBLISHABLE_KEY}"
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Use production Capacitor config
        run: |
          cp capacitor.config.prod.ts capacitor.config.ts

      - name: Add Android platform
        run: |
          if [ -f "android/build.gradle" ]; then
            echo "Full Capacitor android project already exists, skipping cap add."
          else
            if [ -d "android" ]; then
              echo "Partial android/ overlay detected — stashing before cap add."
              mv android android-overlay
            fi
            npx cap add android
            if [ -d "android-overlay" ]; then
              echo "Restoring overlay files on top of generated project."
              cp -R android-overlay/. android/
              rm -rf android-overlay
            fi
          fi

      - name: Install google-services.json (Firebase / FCM)
        run: |
          cp android-config/google-services.json android/app/google-services.json
          echo "google-services.json installed:"
          ls -la android/app/google-services.json

      - name: Wire Android Gradle plugins
        run: |
          # 1) Add Kotlin + google-services classpaths to project-level build.gradle
          PROJECT_GRADLE="android/build.gradle"
          if ! grep -q "org.jetbrains.kotlin:kotlin-gradle-plugin" "$PROJECT_GRADLE"; then
            sed -i "s|classpath 'com.android.tools.build:gradle.*|&\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'|" "$PROJECT_GRADLE"
          fi
          if ! grep -q "com.google.gms:google-services" "$PROJECT_GRADLE"; then
            sed -i "s|classpath 'com.android.tools.build:gradle.*|&\n        classpath 'com.google.gms:google-services:4.4.2'|" "$PROJECT_GRADLE"
          fi

          # 2) Compile committed .kt native plugins (MainActivity, ExoPlayer, InnerTube).
          APP_GRADLE="android/app/build.gradle"
          if ! grep -q "apply plugin: 'kotlin-android'" "$APP_GRADLE"; then
            sed -i "/apply plugin: 'com.android.application'/a apply plugin: 'kotlin-android'" "$APP_GRADLE"
          fi
          if ! grep -q "KotlinCompile" "$APP_GRADLE"; then
            cat >> "$APP_GRADLE" <<'EOF'

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "21"
              }
          }
          EOF
          fi

          # 3) Apply google-services plugin only if app build.gradle doesn't already
          # contain the safe package-name guard committed in the repo.
          if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
            echo "" >> "$APP_GRADLE"
            echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
          fi

          # 4) Add Firebase Messaging dependency
          if ! grep -q "firebase-messaging" "$APP_GRADLE"; then
            sed -i "s|dependencies {|dependencies {\n    implementation platform('com.google.firebase:firebase-bom:33.5.1')\n    implementation 'com.google.firebase:firebase-messaging'|" "$APP_GRADLE"
          fi

          echo "=== project build.gradle ==="
          grep -n "google-services\|firebase\|kotlin" "$PROJECT_GRADLE" || true
          echo "=== app build.gradle ==="
          grep -n "google-services\|firebase\|kotlin\|KotlinCompile\|jvmTarget" "$APP_GRADLE" || true

      - name: Write MainActivity (registers native plugins, deferred camera only)
        run: |
          PKG="com.universeflow.app"
          PKG_PATH="com/universeflow/app"
          MAIN_ACTIVITY_KT="android/app/src/main/java/${PKG_PATH}/MainActivity.kt"
          MAIN_ACTIVITY="android/app/src/main/java/${PKG_PATH}/MainActivity.java"

          if [ -f "$MAIN_ACTIVITY_KT" ]; then
            # Capacitor may have generated a Java stub during `cap add`; keeping
            # both MainActivity.java and MainActivity.kt creates duplicate class
            # builds or, worse, ships the stub without native plugin registration.
            rm -f "$MAIN_ACTIVITY"
            echo "Using committed Kotlin MainActivity with all native plugins: $MAIN_ACTIVITY_KT"
            exit 0
          fi

          mkdir -p "$(dirname "$MAIN_ACTIVITY")"
          cat > "$MAIN_ACTIVITY" <<EOF
          package ${PKG};

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
              private static final int CAMERA_REQ_CODE = 4711;
              private PermissionRequest pendingPermissionRequest;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AudioFocusPlugin.class);
                  registerPlugin(InnerTubePlugin.class);
                  registerPlugin(ExoPlayerPlugin.class);
                  
                  super.onCreate(savedInstanceState);

                  WebView web = bridge.getWebView();
                  if (web != null) {
                      web.getSettings().setJavaScriptEnabled(true);
                      web.getSettings().setMediaPlaybackRequiresUserGesture(false);
                      web.getSettings().setAllowFileAccess(true);
                      web.getSettings().setAllowContentAccess(true);
                      // Keep file-picker support, but defer CAMERA permission until
                      // the face-liveness screen actually calls getUserMedia().
                      web.setWebChromeClient(new BridgeWebChromeClient(bridge) {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> {
                                  boolean needsCamera = false;
                                  for (String resource : request.getResources()) {
                                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)) {
                                          needsCamera = true;
                                          break;
                                      }
                                  }

                                  if (needsCamera
                                      && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                                      && ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                                      pendingPermissionRequest = request;
                                      ActivityCompat.requestPermissions(
                                          MainActivity.this,
                                          new String[]{ Manifest.permission.CAMERA },
                                          CAMERA_REQ_CODE
                                      );
                                  } else {
                                      try { request.grant(request.getResources()); }
                                      catch (Throwable t) { request.deny(); }
                                  }
                              });
                          }
                      });
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == CAMERA_REQ_CODE) {
                      PermissionRequest req = pendingPermissionRequest;
                      pendingPermissionRequest = null;
                      if (req != null) {
                          boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                          runOnUiThread(() -> {
                              try { if (granted) req.grant(req.getResources()); else req.deny(); }
                              catch (Throwable ignored) {}
                          });
                      }
                  }
              }
          }
          EOF

          echo "MainActivity registered at: $MAIN_ACTIVITY"


      - name: Ensure legacy WebView media service is disabled
        run: |
          # Android playback is now owned by ExoPlayerService. Do NOT copy or
          # register the old MediaNotificationService here: running both
          # foreground media services can crash the APK during launch/restore on
          # Android 12+ with ForegroundServiceDidNotStartInTimeException.
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          rm -rf android/app/src/main/java/com/universeflow/app/media
          if grep -q "MediaNotificationService" "$MANIFEST"; then
            echo "::error::Legacy MediaNotificationService is still registered in AndroidManifest.xml"
            exit 1
          fi
          echo "Legacy WebView media service disabled; ExoPlayerService owns background playback."


      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify native package and launcher activity
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          APP_GRADLE="android/app/build.gradle"
          MAIN_KT="android/app/src/main/java/com/universeflow/app/MainActivity.kt"
          if ! grep -q 'applicationId "com.universeflow.app"' "$APP_GRADLE"; then
            echo "::error::Wrong Android applicationId; expected com.universeflow.app"
            sed -n '1,80p' "$APP_GRADLE"
            exit 1
          fi
          if grep -R "app.lovable" android/app/src/main/java android/app/src/main/AndroidManifest.xml; then
            echo "::error::Lovable package leaked into APK native sources"
            exit 1
          fi
          if [ ! -f "$MAIN_KT" ]; then
            echo "::error::Kotlin MainActivity missing; native ExoPlayer/InnerTube plugins will not register"
            exit 1
          fi
          if grep -q "MediaNotificationService" "$MANIFEST"; then
            echo "::error::Legacy MediaNotificationService is still registered"
            exit 1
          fi
          echo "Native package verified: com.universeflow.app"

      - name: Apply custom app launcher icon (Universflow logo)
        run: |
          ICON="android-config/app-icon.png"
          if [ -f "$ICON" ]; then
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              DIR="android/app/src/main/res/$d"
              mkdir -p "$DIR"
              cp "$ICON" "$DIR/ic_launcher.png"
              cp "$ICON" "$DIR/ic_launcher_round.png"
              cp "$ICON" "$DIR/ic_launcher_foreground.png"
            done
            # Remove any adaptive-icon XMLs so the raw PNG is used directly
            # (no zoom / no inset clipping by the system).
            rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
                  android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || true
            echo "Custom launcher icon applied (raw, no adaptive crop)."
          else
            echo "No custom icon found, using Capacitor default."
          fi

      - name: Install notification status-bar icon (white silhouette)
        run: |
          declare -A SIZES=( [mdpi]=24 [hdpi]=36 [xhdpi]=48 [xxhdpi]=72 [xxxhdpi]=96 )
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            SRC="android-config/notif-${d}.png"
            DIR="android/app/src/main/res/drawable-${d}"
            mkdir -p "$DIR"
            if [ -f "$SRC" ]; then
              cp "$SRC" "$DIR/ic_stat_notify.png"
            fi
          done

          # Tell FCM to use this icon for incoming push notifications,
          # plus an accent color so Android tints it correctly.
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "default_notification_icon" "$MANIFEST"; then
            sed -i 's|</application>|    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_notify" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/notification_color" />\n    </application>|' "$MANIFEST"
          fi

          # Define the accent color resource
          COLORS="android/app/src/main/res/values/colors.xml"
          mkdir -p "$(dirname "$COLORS")"
          if [ ! -f "$COLORS" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><resources></resources>' > "$COLORS"
          fi
          if ! grep -q "notification_color" "$COLORS"; then
            sed -i 's|</resources>|    <color name="notification_color">#FF2D55</color>\n</resources>|' "$COLORS"
          fi
          echo "Notification icon installed."


      - name: Configure APK (universal ABI, no splits, debug unminified)
        run: |
          APP_GRADLE="android/app/build.gradle"

          # Single universal APK that runs on every Android device
          # (armv7 = old phones, arm64 = modern phones, x86/x86_64 = emulators).
          if ! grep -q "ndk {" "$APP_GRADLE"; then
            sed -i "s|defaultConfig {|defaultConfig {\n        ndk {\n            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'\n        }|" "$APP_GRADLE"
          fi

          # Never produce per-ABI / per-density slices.
          if ! grep -q "splits {" "$APP_GRADLE"; then
            sed -i "s|android {|android {\n    splits {\n        abi { enable false }\n    }|" "$APP_GRADLE"
          fi

          # Debug build = unminified so stack traces are readable.
          if ! grep -q "buildTypes {" "$APP_GRADLE"; then
            sed -i "s|android {|android {\n    buildTypes {\n        debug {\n            minifyEnabled false\n            shrinkResources false\n            debuggable true\n        }\n    }|" "$APP_GRADLE"
          fi

          echo "=== Patched app build.gradle ==="
          sed -n '1,80p' "$APP_GRADLE"

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify built APK manifest
        run: |
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/aapt"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BAD=0
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          if ! grep -q "package: name='com.universeflow.app'" /tmp/apk-badging.txt; then
            echo "::error::Built APK has wrong package name"
            BAD=1
          fi
          if ! "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q "ExoPlayerService"; then
            echo "::error::Built APK is missing ExoPlayerService"
            BAD=1
          fi
          if "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q "MediaNotificationService"; then
            echo "::error::Built APK still contains legacy MediaNotificationService"
            BAD=1
          fi
          exit "$BAD"


      - name: Rename APK to Univers Flow.apk
        run: |
          mkdir -p android/app/build/outputs/apk/debug/renamed
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/renamed/Univers Flow.apk"
          ls -la "android/app/build/outputs/apk/debug/renamed/"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Univers Flow
          path: "android/app/build/outputs/apk/debug/renamed/Univers Flow.apk"
          retention-days: 30

