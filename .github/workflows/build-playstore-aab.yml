name: Build Play Store AAB (signed)

# Produces a signed Android App Bundle (.aab) ready to upload to the
# Google Play Console. Requires four repository secrets:
#
#   ANDROID_KEYSTORE_BASE64  - your upload keystore (.jks) encoded with:
#                              base64 -w0 upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Keep a permanent backup of the keystore file and its passwords. If the
# upload key is lost, the app can never be updated on Play again.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown to users (e.g. 1.0.2)'
        required: true
        default: '1.0.2'
      version_code:
        description: 'Play version code — must be higher than every previous upload'
        required: true
        default: '3'

jobs:
  aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Fail early if signing secrets are missing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=0
          for V in KS KSP KA KP; do
            if [ -z "${!V}" ]; then echo "::error::Missing signing secret ($V)"; MISSING=1; fi
          done
          exit "$MISSING"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets (native shell)
        run: |
          export VITE_SUPABASE_URL="${VITE_SUPABASE_URL:-$(grep '^VITE_SUPABASE_URL=' .env | cut -d= -f2- | tr -d '"')}"
          export VITE_SUPABASE_PUBLISHABLE_KEY="${VITE_SUPABASE_PUBLISHABLE_KEY:-$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2- | tr -d '"')}"
          export VITE_SUPABASE_PROJECT_ID="${VITE_SUPABASE_PROJECT_ID:-$(grep '^VITE_SUPABASE_PROJECT_ID=' .env | cut -d= -f2- | tr -d '"')}"
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Supabase env missing — the bundle would black-screen. Aborting build."
            exit 1
          fi
          npm run build:native
          if [ ! -f dist/client/index.html ]; then
            echo "::error::dist/client/index.html missing — the bundle would be a black screen. Aborting."
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Use production Capacitor config
        run: cp capacitor.config.prod.ts capacitor.config.ts

      # The repository stores only the native overlay (app/src, build.gradle for
      # :app). The rest of the Gradle project is generated, exactly like the APK
      # workflow does — without this step `cap sync` has no project to sync.
      - name: Add Android platform
        run: |
          if [ -f "android/build.gradle" ]; then
            echo "Full Capacitor android project already exists, skipping cap add."
          else
            if [ -d "android" ]; then
              echo "Partial android/ overlay detected — stashing before cap add."
              mv android android-overlay
            fi
            npx cap add android
            if [ -d "android-overlay" ]; then
              echo "Restoring overlay files on top of generated project."
              cp -R android-overlay/. android/
              rm -rf android-overlay
            fi
          fi

      - name: Install google-services.json (Firebase / FCM)
        run: |
          cp android-config/google-services.json android/app/google-services.json
          ls -la android/app/google-services.json

      - name: Wire Android Gradle plugins
        run: |
          PROJECT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"

          if ! grep -q "org.jetbrains.kotlin:kotlin-gradle-plugin" "$PROJECT_GRADLE"; then
            sed -i "s|classpath 'com.android.tools.build:gradle.*|&\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'|" "$PROJECT_GRADLE"
          fi
          if ! grep -q "com.google.gms:google-services" "$PROJECT_GRADLE"; then
            sed -i "s|classpath 'com.android.tools.build:gradle.*|&\n        classpath 'com.google.gms:google-services:4.4.2'|" "$PROJECT_GRADLE"
          fi
          if ! grep -q "apply plugin: 'kotlin-android'" "$APP_GRADLE"; then
            sed -i "/apply plugin: 'com.android.application'/a apply plugin: 'kotlin-android'" "$APP_GRADLE"
          fi
          if ! grep -q "KotlinCompile" "$APP_GRADLE"; then
            printf "\ntasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {\n    kotlinOptions {\n        jvmTarget = \"21\"\n    }\n}\n" >> "$APP_GRADLE"
          fi
          if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
            echo "" >> "$APP_GRADLE"
            echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
          fi
          if ! grep -q "firebase-messaging" "$APP_GRADLE"; then
            sed -i "s|dependencies {|dependencies {\n    implementation platform('com.google.firebase:firebase-bom:33.5.1')\n    implementation 'com.google.firebase:firebase-messaging'|" "$APP_GRADLE"
          fi
          if ! grep -q "ndk {" "$APP_GRADLE"; then
            sed -i "s|defaultConfig {|defaultConfig {\n        ndk {\n            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'\n        }|" "$APP_GRADLE"
          fi
          # Capacitor may generate a Java MainActivity stub; the committed Kotlin
          # one registers the native audio plugins, so the stub must go.
          rm -f android/app/src/main/java/com/universeflow/app/MainActivity.java

      - name: Apply custom app launcher icon
        run: |
          ICON="android-config/app-icon.png"
          if [ -f "$ICON" ]; then
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              DIR="android/app/src/main/res/$d"
              mkdir -p "$DIR"
              cp "$ICON" "$DIR/ic_launcher.png"
              cp "$ICON" "$DIR/ic_launcher_round.png"
              cp "$ICON" "$DIR/ic_launcher_foreground.png"
            done
            rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
                  android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || true
          fi

      - name: Install notification status-bar icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            SRC="android-config/notif-${d}.png"
            DIR="android/app/src/main/res/drawable-${d}"
            mkdir -p "$DIR"
            if [ -f "$SRC" ]; then cp "$SRC" "$DIR/ic_stat_notify.png"; fi
          done

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "default_notification_icon" "$MANIFEST"; then
            sed -i 's|</application>|    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_notify" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/notification_color" />\n    </application>|' "$MANIFEST"
          fi

          COLORS="android/app/src/main/res/values/colors.xml"
          mkdir -p "$(dirname "$COLORS")"
          if [ ! -f "$COLORS" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><resources></resources>' > "$COLORS"
          fi
          if ! grep -q "notification_color" "$COLORS"; then
            sed -i 's|</resources>|    <color name="notification_color">#FF2D55</color>\n</resources>|' "$COLORS"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply version + write signing config
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          APP_GRADLE="android/app/build.gradle"
          sed -i "s|versionCode .*|versionCode ${VERSION_CODE}|" "$APP_GRADLE"
          sed -i "s|versionName .*|versionName \"${VERSION_NAME}\"|" "$APP_GRADLE"

          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

          cat > android/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

          grep -n "versionCode\|versionName" "$APP_GRADLE"

      - name: Build signed AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify the bundle is signed
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB" || { echo "::error::No AAB produced"; exit 1; }
          unzip -l "$AAB" | grep -q "META-INF" || { echo "::error::AAB is not signed"; exit 1; }
          ls -la "$AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v5
        with:
          name: Univers Flow Play Store AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Remove signing material from the runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/keystore.properties
