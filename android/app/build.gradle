apply plugin: 'com.android.application'

android {
    namespace "com.universeflow.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.universeflow.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate
            // modern web apps. Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Universe Flow native audio stack
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Rhino JS engine — used by PlayerJsManager to run YouTube's
    // signatureCipher + n-param functions ON DEVICE, exactly like NewPipe
    // does. This is what lets us race the WEB client and stop relying on
    // pre-signed mobile/TV streams that YouTube throttles.
    implementation 'org.mozilla:rhino:1.7.15'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        def appPackageName = android.defaultConfig.applicationId
        def json = new groovy.json.JsonSlurper().parseText(servicesJSON.text)
        def googlePackageName = json?.client?.getAt(0)?.client_info?.android_client_info?.package_name
        if (googlePackageName == appPackageName) {
            apply plugin: 'com.google.gms.google-services'
        } else {
            logger.warn("google-services.json package_name (${googlePackageName}) does not match applicationId (${appPackageName}); google-services plugin not applied. Push Notifications won't work until the JSON is updated.")
        }
    }
} catch(Exception e) {
    logger.info("google-services.json not found or invalid, google-services plugin not applied. Push Notifications won't work")
}

